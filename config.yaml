# DeepGuard Configuration
dataset:
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  train_path: "../archive/real_vs_fake/real-vs-fake/train"
  val_path: "../archive/real_vs_fake/real-vs-fake/valid"
  test_path: "../archive/real_vs_fake/real-vs-fake/test"

training:
  image_size: 224
  batch_size: 32
  learning_rate: 0.001
  epochs: 1
  num_workers: 4
  device_preference: "auto" # Will select cuda -> mps -> cpu
  checkpoint_dir: "models/checkpoints"
  best_model_path: "models/best_model.pth"

model:
  name: "efficientnet_b0"
  num_classes: 2
  classes: ["REAL", "DEEPFAKE"]

inference:
  video_frames_to_sample: 20
